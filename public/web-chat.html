<!doctype html>
<html lang="bs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Majstor BL — Web Test Chat</title>
    <style>
      :root {
        --bg: #f0f2f5;
        --panel: #ffffff;
        --user: #0b93f6;
        --bot: #e5e5ea;
        --border: #d1d5db;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
        background: var(--bg);
        color: #111;
      }
      .wrap {
        max-width: 640px;
        margin: 0 auto;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--panel);
      }
      header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      header h1 {
        font-size: 16px;
        margin: 0;
      }
      #resetBtn {
        font-size: 13px;
        padding: 6px 10px;
        border: 1px solid var(--border);
        background: #fff;
        border-radius: 6px;
        cursor: pointer;
      }
      #resetBtn:hover {
        background: #f5f5f5;
      }
      .note {
        font-size: 12px;
        color: #555;
        padding: 8px 16px;
        background: #fff7e6;
        border-bottom: 1px solid var(--border);
      }
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .msg {
        max-width: 80%;
        padding: 8px 12px;
        border-radius: 14px;
        white-space: pre-wrap;
        word-wrap: break-word;
        line-height: 1.35;
        font-size: 14px;
      }
      .msg.user {
        align-self: flex-end;
        background: var(--user);
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .msg.bot {
        align-self: flex-start;
        background: var(--bot);
        color: #111;
        border-bottom-left-radius: 4px;
      }
      .msg.error {
        align-self: center;
        background: #fde2e1;
        color: #8a1c1c;
        font-size: 13px;
      }
      form {
        display: flex;
        gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid var(--border);
      }
      #input {
        flex: 1;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 14px;
      }
      #sendBtn {
        padding: 10px 16px;
        border: none;
        background: var(--user);
        color: #fff;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
      }
      #sendBtn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Majstor BL — Web Test Chat</h1>
        <button id="resetBtn" type="button">Nova konverzacija</button>
      </header>
      <div class="note">
        Ovo je tekstualni test UI. Ako bot traži fotografiju, za sada napišite
        „Dalje”.
      </div>
      <div id="messages" aria-live="polite"></div>
      <form id="chatForm" autocomplete="off">
        <input
          id="input"
          type="text"
          placeholder="Napišite poruku…"
          aria-label="Poruka"
        />
        <button id="sendBtn" type="submit">Pošalji</button>
      </form>
    </div>

    <!-- Web Test UI for the existing POST /channels/web/message endpoint. -->
    <script>
      (function () {
        "use strict";

        var ENDPOINT = "/channels/web/message";
        var STORAGE_KEY = "majstorbl_web_userid";

        var messagesEl = document.getElementById("messages");
        var formEl = document.getElementById("chatForm");
        var inputEl = document.getElementById("input");
        var sendBtn = document.getElementById("sendBtn");
        var resetBtn = document.getElementById("resetBtn");

        var userId = null;
        var busy = false;

        // Generate a stable, reasonably unique browser userId.
        function newUserId() {
          return (
            "web-" +
            Math.random().toString(36).slice(2, 10) +
            "-" +
            String(new Date().getTime())
          );
        }

        function loadUserId() {
          var stored = null;
          try {
            stored = window.localStorage.getItem(STORAGE_KEY);
          } catch (e) {
            stored = null;
          }
          if (!stored) {
            stored = newUserId();
            try {
              window.localStorage.setItem(STORAGE_KEY, stored);
            } catch (e) {
              /* localStorage unavailable — keep in memory only */
            }
          }
          return stored;
        }

        function resetUserId() {
          var fresh = newUserId();
          try {
            window.localStorage.setItem(STORAGE_KEY, fresh);
          } catch (e) {
            /* ignore */
          }
          return fresh;
        }

        // Safe text rendering — uses textContent, so multiline bot replies
        // (e.g. final summaries) render correctly and safely.
        function addMessage(text, kind) {
          var div = document.createElement("div");
          div.className = "msg " + kind;
          div.textContent = text;
          messagesEl.appendChild(div);
          messagesEl.scrollTop = messagesEl.scrollHeight;
          return div;
        }

        // Bot replies arrive prefixed with "Bot: ". Strip it for display only;
        // the backend behavior is unchanged.
        function cleanReply(reply) {
          if (typeof reply !== "string") return "";
          return reply.replace(/^Bot:\s?/, "");
        }

        function setBusy(state) {
          busy = state;
          sendBtn.disabled = state;
          inputEl.disabled = state;
        }

        // Send text to the existing Web/Internal endpoint. isStart=true allows
        // the single automatic empty START call; manual empty sends are ignored.
        function send(text, isStart) {
          if (busy) return;
          if (!isStart && text.trim() === "") return;

          if (!isStart) {
            addMessage(text, "user");
          }

          setBusy(true);

          fetch(ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ userId: userId, text: text }),
          })
            .then(function (res) {
              if (!res.ok) {
                throw new Error("HTTP " + res.status);
              }
              return res.json();
            })
            .then(function (data) {
              addMessage(cleanReply(data && data.reply), "bot");
            })
            .catch(function () {
              addMessage(
                "Greška u komunikaciji sa serverom. Pokušajte ponovo.",
                "error",
              );
            })
            .then(function () {
              setBusy(false);
              inputEl.focus();
            });
        }

        formEl.addEventListener("submit", function (e) {
          e.preventDefault();
          var text = inputEl.value;
          if (text.trim() === "" || busy) return;
          inputEl.value = "";
          send(text, false);
        });

        resetBtn.addEventListener("click", function () {
          if (busy) return;
          userId = resetUserId();
          messagesEl.replaceChildren();
          send("", true);
        });

        // Initial load — establish userId and start the conversation once.
        userId = loadUserId();
        send("", true);
      })();
    </script>
  </body>
</html>
